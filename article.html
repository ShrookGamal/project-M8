<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>زهور الرياض | مقالاتنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .article-main { padding: 150px 0; max-width: 1000px; margin: 0 auto; width: 90%; }
        #article-title { font-size: 3.5rem; color: #113d2c; font-weight: 900; margin-bottom: 30px; text-align: center; }
        #article-image { width: 100%; height: 500px; object-fit: cover; border-radius: 40px; margin-bottom: 50px; border-bottom: 8px solid #c5a059; }
        #article-body { font-size: 1.3rem; line-height: 2.2; color: #333; text-align: justify; }
        .back-nav { margin-bottom: 40px; display: inline-block; color: #c5a059; text-decoration: none; font-weight: 800; font-size: 1.2rem; }
        strong { color: #113d2c; }
        h2 { color: #c5a059; margin-top: 40px; font-size: 2rem; }
    </style>
</head>
<body>

    <main class="article-main">
        <a href="blog-page.html" class="back-nav">← العودة لكافة المقالات</a>
        <h1 id="article-title">جاري تحميل المقال...</h1>
        <img id="article-image" src="" alt="">
        <div id="article-body"></div>
    </main>

    <!-- استدعاء ملف البيانات والذكاء البرمجي -->
    <script src="blog-data.js"></script>
    <script>
        // الحصول على ID المقال من الرابط
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        // البحث عن المقال في ملف البيانات
        const article = blogPosts.find(p => p.id == articleId);

        if (article) {
            document.title = article.title + " | زهور الرياض";
            document.getElementById('article-title').innerText = article.title;
            document.getElementById('article-image').src = article.image;
            document.getElementById('article-body').innerHTML = article.content;
        } else {
            document.getElementById('article-title').innerText = "المقال غير موجود!";
        }
    </script>
</body>
</html>
